# Only preview/branch builds are gated here. Production does NOT run this staging check.
# Netlify secrets and Supabase project keys must be configured in Netlify's
# deploy-context-specific environment settings, never in this file.
[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "node scripts/staging-preflight.mjs && npm run build"

[context.branch-deploy]
  command = "node scripts/staging-preflight.mjs && npm run build"
